distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 官方源在国内经常超时，改用腾讯云镜像（与官方同一份文件，SHA-256 一致）
# 注意：不要写 file:/// 本地绝对路径 —— 那是提交者自己机器上的文件，别人 clone 后必然失败
# 如需完全离线，请在本地创建 android/local.properties 或改本文件（但不要提交）
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-all.zip
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
